name: EasyDraw CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://easydraw_test:easydraw_test@127.0.0.1:5433/easydraw_test?schema=public
      JWT_SECRET: ci-only-jwt-secret
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:3000/auth/google/callback

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: easydraw_test
          POSTGRES_USER: easydraw_test
          POSTGRES_PASSWORD: easydraw_test

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U easydraw_test -d easydraw_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm exec -- prisma generate

      - name: Apply test database migrations
        run: npm exec -- prisma migrate deploy --config prisma.test.config.ts

      - name: Run server unit tests
        run: npm test -- --runInBand

      - name: Run server end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build server
        run: npm run build

  client:
    name: Client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --no-audit --no-fund

      # `next build` type-checks the whole app, so it covers what the SvelteKit
      # `npm run check` step used to do.
      - name: Build client
        run: npm run build
