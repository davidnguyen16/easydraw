<text x="959" y="359" fill="#25384b" font-size="37" transform="rotate(-1 959 359)">Teacher construction</text>
<text x="965" y="419" fill="#2563eb" font-size="34" transform="rotate(1 965 419)">1. Volume</text>
<text x="978" y="469" fill="#25384b" font-size="28" transform="rotate(0 978 469)">N is the midpoint of BC.</text>
<text x="978" y="513" fill="#25384b" font-size="28" transform="rotate(0 978 513)">Use right triangle ANA′</text>
<text x="978" y="557" fill="#cf8516" font-size="28" transform="rotate(0 978 557)">and the 60° angle at N.</text>
<text x="978" y="601" fill="#2563eb" font-size="28" transform="rotate(0 978 601)">V = base area × height</text>
<text x="965" y="678" fill="#16845b" font-size="34" transform="rotate(-1 965 678)">2. Distance</text>
<text x="978" y="726" fill="#25384b" font-size="28" transform="rotate(0 978 726)">K is the midpoint of B′C′.</text>
<text x="978" y="770" fill="#25384b" font-size="28" transform="rotate(0 978 770)">A′H ⟂ AK, with H on AK.</text>
<text x="978" y="814" fill="#25384b" font-size="28" transform="rotate(0 978 814)">F is the midpoint of AH.</text>
<text x="978" y="858" fill="#d43b43" font-size="28" transform="rotate(0 978 858)">MF ∥ A′H; MF ⟂ (AB′C′).</text>
