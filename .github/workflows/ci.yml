name: EasyDraw CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Shared package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Known advisories below critical are reviewed in
      # docs/release-audit-2026-09-28.md; a new critical one fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Type-check shared packages
        run: npm run typecheck:packages

      - name: Build and test shared packages
        run: npm run test:packages

      - name: Test diagram-to-3D projection
        run: npm run test:diagram3d

  server:
    name: Server checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://easydraw_test:easydraw_test@127.0.0.1:5433/easydraw_test?schema=public
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci-only-jwt-secret
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:3000/auth/google/callback

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: easydraw_test
          POSTGRES_USER: easydraw_test
          POSTGRES_PASSWORD: easydraw_test

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U easydraw_test -d easydraw_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Install scripts run only where package.json `allowScripts` approves
      # them: Prisma's schema engine download, needed for migrations.
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared packages used by server
        run: npm run build:packages

      - name: Generate Prisma client
        working-directory: server
        run: npm exec -- prisma generate

      # Type-aware lint needs the generated client; never --fix in CI.
      - name: Lint server
        working-directory: server
        run: npm run lint:check

      - name: Apply test database migrations
        working-directory: server
        run: npm exec -- prisma migrate deploy --config prisma.test.config.ts

      - name: Run server unit tests
        working-directory: server
        run: npm test -- --runInBand

      - name: Run server end-to-end tests
        working-directory: server
        run: npm run test:e2e -- --runInBand

      - name: Build server
        working-directory: server
        run: npm run build

  server-image:
    name: Server image build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The same Dockerfile and root context the deploy workflow releases.
      - name: Build migration and API images
        run: |
          docker buildx build --load -f server/Dockerfile --target migrate -t easydraw-api:ci-migrate .
          docker buildx build --load -f server/Dockerfile --target runtime -t easydraw-api:ci .

      - name: Refuse unverified database TLS in production
        run: |
          if docker run --rm -e DATABASE_URL='postgresql://u:p@db/x?sslmode=require' \
            -e CLIENT_URL=https://easydraw.net -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e GOOGLE_REDIRECT_URI=https://api.easydraw.net/auth/google/callback easydraw-api:ci > refusal.log 2>&1; then
            echo "::error::The API started without sslmode=verify-full"; exit 1
          fi
          grep -q 'sslmode=verify-full in production' refusal.log

      # Exercises the runtime image's real dependency set (bcrypt, validation,
      # Prisma, diagram schema, Origin guard), not just a health ping.
      - name: Migrate a fresh database and exercise the API
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_DB=easydraw -e POSTGRES_USER=easydraw -e POSTGRES_PASSWORD=easydraw postgres:16-alpine
          for _ in $(seq 1 30); do docker exec db pg_isready -U easydraw -d easydraw && break; sleep 1; done
          # NODE_ENV=test only relaxes the production TLS rule for this
          # throwaway container network; everything else is the release image.
          URL=postgresql://easydraw:easydraw@db:5432/easydraw
          docker run --rm --network smoke -e NODE_ENV=test -e DATABASE_URL="$URL" easydraw-api:ci-migrate
          docker run -d --name api --network smoke -p 3000:3000 -e NODE_ENV=test -e DATABASE_URL="$URL" \
            -e CLIENT_URL=http://localhost:5173 -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e GOOGLE_REDIRECT_URI=http://localhost:3000/auth/google/callback easydraw-api:ci
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors http://localhost:3000/health
          docker exec api node -e 'require("sharp")'
          api() { curl --fail --silent --show-error -b jar -c jar -H 'Origin: http://localhost:5173' -H 'Content-Type: application/json' "$@"; }
          api -d '{"email":"smoke@example.invalid","password":"smoke-password-1"}' http://localhost:3000/auth/register > /dev/null
          api -d '{"title":"Smoke diagram","type":"flowchart"}' http://localhost:3000/diagrams > /dev/null
          api http://localhost:3000/diagrams | grep -q 'Smoke diagram'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -b jar -H 'Origin: https://attacker.example' -X POST http://localhost:3000/auth/logout)
          test "$status" = 403

      - name: Show API logs
        if: failure()
        run: docker logs api || true

  client:
    name: Client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build shared packages
        run: npm run build:packages

      - name: Lint client
        run: npm run lint -w easydraw -- --max-warnings 0

      - name: Client unit tests
        run: npm run test -w easydraw

      # `next build` type-checks the whole app, so it covers what the SvelteKit
      # `npm run check` step used to do.
      - name: Build client
        run: npm run build -w easydraw
