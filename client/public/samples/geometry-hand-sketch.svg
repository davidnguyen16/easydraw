<text x="963" y="969" fill="#16845b" font-size="26" transform="rotate(0 963 969)">Green: target plane (AB′C′)</text>
<text x="963" y="1009" fill="#d43b43" font-size="26" transform="rotate(0 963 1009)">Red MF: the distance to find</text>
<text x="77" y="1074" fill="#708090" font-size="29" transform="rotate(-0.2 77 1074)">Sketch not to scale — use the construction to explain each step.</text>
